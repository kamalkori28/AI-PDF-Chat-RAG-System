services:
  - type: web
    name: enterprise-rag-backend
    runtime: docker
    rootDir: backend
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-rag-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OLLAMA_BASE_URL
        value: https://your-ollama-host.example.com
      - key: OLLAMA_CHAT_MODEL
        value: llama3
      - key: OLLAMA_EMBEDDING_MODEL
        value: nomic-embed-text
      - key: OLLAMA_REQUEST_TIMEOUT_SECONDS
        value: "30"
      - key: CHROMA_COLLECTION_NAME
        value: enterprise_pdf_chunks_ollama
      - key: BACKEND_CORS_ORIGINS
        value: https://enterprise-rag-frontend.onrender.com

  - type: web
    name: enterprise-rag-frontend
    runtime: docker
    rootDir: frontend
    plan: starter
    dockerBuildArgs:
      NEXT_PUBLIC_API_URL: https://enterprise-rag-backend.onrender.com/api/v1
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://enterprise-rag-backend.onrender.com/api/v1

databases:
  - name: enterprise-rag-db
    plan: starter
