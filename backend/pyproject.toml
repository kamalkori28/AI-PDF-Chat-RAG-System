[project]
name = "enterprise-pdf-rag-backend"
version = "1.0.0"
description = "FastAPI backend for an enterprise AI PDF chat RAG assistant"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "UP017"]
